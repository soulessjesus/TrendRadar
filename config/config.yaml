```yaml
app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: false

crawler:
  request_interval: 1000
  enable_crawler: true
  use_proxy: false

notification:
  enable_notification: true
  message_batch_size: 4000
  batch_send_interval: 3
  # Kept these for safety so the code doesn't crash:
  dingtalk_batch_size: 20000
  feishu_batch_size: 29000
  feishu_message_separator: "━━━━━━━━━━━━━━━━━━━"

  webhooks:
    # ⚠️ DO NOT PASTE TOKEN HERE. It reads from your Secrets!
    telegram_bot_token: "" 
    telegram_chat_id: "" 
    
    # LEAVE THESE EMPTY but do not delete them:
    feishu_url: ""
    dingtalk_url: ""
    wework_url: ""
    email_from: ""
    email_password: ""
    email_to: ""
    email_smtp_server: ""
    email_smtp_port: ""
    ntfy_server_url: "https://ntfy.sh"
    ntfy_topic: ""
    ntfy_token: ""

report:
  mode: "daily" 
  rank_threshold: 10

weight:
  rank_weight: 0.6
  frequency_weight: 0.3
  hotness_weight: 0.1

platforms:
  - id: "wallstreetcn-hot"
    name: "WallStreetCN (Finance)"
  - id: "cls-hot"
    name: "Cailian Press (Finance)"
  - id: "weibo"
    name: "Weibo"
  - id: "douyin"
    name: "Douyin"
  - id: "bilibili-hot-search"
    name: "Bilibili"
  - id: "baidu"
    name: "Baidu"
  - id: "toutiao"
    name: "Toutiao"
```

