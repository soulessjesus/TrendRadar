```yaml
app:
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  show_version_update: false

crawler:
  request_interval: 1000
  enable_crawler: true
  use_proxy: false

# Notification Settings
notification:
  enable_notification: true
  message_batch_size: 4000
  batch_send_interval: 3
  
  # ⚠️ DO NOT PASTE YOUR TOKEN HERE. 
  # The code will read it from the GitHub Secrets you already set up!
  webhooks:
    telegram_bot_token: "" 
    telegram_chat_id: "" 

# Report Mode
report:
  mode: "daily" # Options: "daily" (summary), "current" (now), "incremental" (only new stuff)
  rank_threshold: 10

# Keywords weight (How the AI decides what is important)
weight:
  rank_weight: 0.6
  frequency_weight: 0.3
  hotness_weight: 0.1

# ⚠️ PLATFORMS LIST
# This tool ONLY supports the following. 
# You cannot add IG/YouTube as the code does not exist for them yet.
platforms:
  - id: "wallstreetcn-hot"
    name: "WallStreetCN (Finance)"
  - id: "cls-hot"
    name: "Cailian Press (Finance)"
  - id: "weibo"
    name: "Weibo (China Twitter)"
  - id: "douyin"
    name: "Douyin (China TikTok)"
  - id: "bilibili-hot-search"
    name: "Bilibili (China YouTube)"
  - id: "baidu"
    name: "Baidu Search"
  - id: "toutiao"
    name: "Toutiao News"
```
